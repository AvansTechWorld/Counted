<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#16223A">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Count It</title>
<style>
:root{--bg:#F3F4F8;--s:#fff;--s2:#EBEEF4;--tx:#111A2C;--mut:#69758A;--ln:#E1E5ED;--ink:#16223A;--ac:#FFC61A;--ok:#0F9D6E;--bad:#E04848;--sh:0 6px 20px rgba(20,34,58,.08)}
:root[data-theme=dark]{--bg:#0B111B;--s:#141D2C;--s2:#1D283B;--tx:#EAF0FA;--mut:#8D9BB3;--ln:#243249;--ink:#0F1828;--sh:0 6px 20px rgba(0,0,0,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B111B;--s:#141D2C;--s2:#1D283B;--tx:#EAF0FA;--mut:#8D9BB3;--ln:#243249;--ink:#0F1828;--sh:0 6px 20px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(110px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
header{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header svg{width:34px;height:34px}header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;flex:1}
.ib2{width:42px;height:42px;border-radius:14px;background:var(--s2);font-size:20px;font-weight:800}
main{max-width:640px;margin:0 auto;padding:4px 14px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:13px}
input,textarea,select{width:100%;padding:14px;border:1.5px solid var(--ln);border-radius:14px;font:inherit;font-size:16px;background:var(--s);color:var(--tx);outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 30%,transparent)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}
.btn{padding:14px 18px;border-radius:16px;font-weight:700;background:var(--s2);transition:transform .12s}.btn:active,.it:active,.chip:active{transform:scale(.96)}
.btn.p{background:var(--ink);color:#fff}.btn.ac{background:var(--ac);color:#2A1E00}.btn.bad{background:var(--bad);color:#fff}.btn.w{width:100%}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:var(--s2);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:var(--s2);font-weight:700;font-size:14px;transition:all .2s}.chip.on{background:var(--ink);color:#fff}
.it{display:flex;align-items:center;gap:8px;background:var(--s);border:1.5px solid var(--ln);border-radius:22px;padding:10px;margin-bottom:10px;transition:transform .12s,border-color .2s,opacity .2s}
.it.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--ln));background:color-mix(in srgb,var(--ok) 7%,var(--s))}
.ck{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);color:transparent;font-weight:800;flex:none;transition:all .2s}.it.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.ib{flex:1;min-width:0;padding:4px 2px;cursor:pointer}.in{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn{width:40px;height:40px;border-radius:50%;background:var(--s2);font-size:22px;font-weight:700;flex:none}
.nm{min-width:58px;height:48px;padding:0 8px;border-radius:15px;background:var(--s2);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;flex:none}
.nm.z{color:var(--bad)}.pl{width:48px;height:48px;border-radius:16px;background:var(--ac);color:#2A1E00;font-size:28px;font-weight:700;line-height:1;flex:none}
.bump{animation:bump .26s ease-out}@keyframes bump{40%{transform:scale(1.3);background:var(--ac)}}
.add{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
.add .in2{max-width:640px;margin:auto;display:flex;gap:8px}.add input{border-radius:18px}.add .btn{flex:none;border-radius:18px}
.sw{position:fixed;inset:0;background:rgba(8,14,26,.55);backdrop-filter:blur(4px);z-index:20;display:none;align-items:flex-end;justify-content:center}.sw.on{display:flex}
.sheet{width:min(100%,540px);max-height:92vh;overflow:auto;background:var(--s);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}.sheet h3{margin:0 0 4px;font-size:22px;letter-spacing:-.5px}
.kv{font-size:46px!important;font-weight:800;text-align:center;letter-spacing:-2px}
.seg{display:flex;background:var(--s2);border-radius:16px;padding:4px}.seg button{flex:1;padding:10px 4px;border-radius:12px;font-size:14px;font-weight:700;color:var(--mut)}.seg button.on{background:var(--s);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:16px;z-index:30;display:flex;gap:14px;align-items:center;font-weight:600;animation:up .25s;box-shadow:0 8px 24px #0005;max-width:92vw}.toast button{color:var(--ac);font-weight:800}
.empty{text-align:center;color:var(--mut);padding:40px 16px;line-height:1.5}.empty b{color:var(--tx);font-size:18px;display:block;margin-bottom:6px}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{text-align:left;background:var(--s);border:1px solid var(--ln);border-radius:22px;padding:16px;box-shadow:var(--sh);transition:transform .12s;min-width:0}.fc:active{transform:scale(.96)}
.fd{width:36px;height:8px;border-radius:9px;background:var(--c);margin-bottom:14px}.fn{font-size:18px;font-weight:800;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.fc.nw{border:2px dashed var(--ln);box-shadow:none;background:none;display:grid;place-items:center;min-height:120px;color:var(--mut);font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><button class="ib2" id="back" data-act="home" hidden aria-label="All folders">‹</button><svg id="lg" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bv" x1="0" x2="1"><stop offset="0" stop-color="#FFF1A6"/><stop offset=".28" stop-color="#FFF1A6"/><stop offset=".28" stop-color="#FFD23F"/><stop offset=".7" stop-color="#FFD23F"/><stop offset=".7" stop-color="#B98A00"/><stop offset="1" stop-color="#B98A00"/></linearGradient></defs><polygon points="6,28 11.2,28 11.2,4 6,4" fill="url(#bv)"/><polygon points="16,28 21.2,28 29.2,5 24,5" fill="url(#bv)"/></svg><h1 id="ttl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Count It</h1><button class="btn ac" id="install" hidden>Install</button><button class="ib2" data-act="menu" aria-label="Menu">⋯</button></header>
<main>
<div id="home"></div>
<div id="inv" hidden>
<div class="card" id="st"></div>
<input id="q" type="search" placeholder="Search items">
<div class="chips" id="ch"></div>
<div id="list"></div>
</div>
</main>
<div class="add" id="addbar" hidden><div class="in2"><input id="qa" placeholder="Add item, e.g. Chairs 12" enterkeyhint="done" autocapitalize="sentences"><button class="btn ac" data-act="qadd">Add</button><button class="btn" data-act="bulk" aria-label="Add many">≡</button></div></div>
<div class="sw" id="sw"></div><input type="file" id="file" hidden>
<script>
const K='countit.v3',$=s=>document.querySelector(s);
let db=(()=>{let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!d){d={items:[],theme:'auto'};
  for(const k of['countit.v2','countit.v1'])try{const o=JSON.parse(localStorage.getItem(k));if(o&&o.items&&o.items.length){o.items.forEach(i=>d.items.push({id:i.id,name:i.name,qty:num(i.exp??i.qty),note:'',ok:false,t:Date.now()}));break}}catch(e){}}
 return d})();
let q='',flt='all',srt='recent',snap=null;
function num(v){const n=parseFloat(v);return isNaN(n)?0:n}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9),fmt=n=>(Math.round(n*100)/100).toLocaleString(),vib=()=>navigator.vibrate&&navigator.vibrate(12);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const item=id=>db.items.find(i=>i.id===id);
const COL=['#FFC61A','#3FA7FF','#0F9D6E','#E8645A','#9B6BFF','#FF8A3D'];
function migrate(){db.folders=db.folders||[];db.cur=db.cur||null;if(db.items.some(i=>!i.fid)){let f=db.folders[0];if(!f){f={id:uid(),name:'My inventory',col:0};db.folders.push(f)}db.items.forEach(i=>{if(!i.fid)i.fid=f.id})}}
migrate();
const cur=()=>db.folders.find(x=>x.id===db.cur)||null,L0=()=>db.items.filter(i=>i.fid===db.cur);
const applyTheme=()=>document.documentElement.dataset.theme=db.theme;
function toast(m,fn){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;
 if(fn){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{fn();t.remove()};t.append(b)}document.body.append(t);setTimeout(()=>t.remove(),4500)}
function sheet(h){const w=$('#sw');w.innerHTML=`<div class="sheet">${h}</div>`;w.classList.add('on');const i=w.querySelector('input,textarea');i&&setTimeout(()=>{i.focus();i.select&&i.select()},120)}
const closeSheet=()=>$('#sw').classList.remove('on');
const mark=()=>snap=JSON.stringify({i:db.items,f:db.folders,c:db.cur}),restore=()=>{if(snap){const s=JSON.parse(snap);db.items=s.i;db.folders=s.f;db.cur=s.c;snap=null;save();render()}};

/* parse "Chairs 12", "12 Chairs", "Chairs x12" */
function parse(t){t=t.trim();let m=t.match(/^(.*?)[\s,:xX×-]*(\d+(?:\.\d+)?)$/);if(m&&m[1].trim())return{name:m[1].trim(),qty:+m[2]};
 m=t.match(/^(\d+(?:\.\d+)?)\s*[xX×]?\s*(.+)$/);if(m)return{name:m[2].trim(),qty:+m[1]};return{name:t,qty:1}}
function addStock(name,qty){const ex=L0().find(i=>i.name.toLowerCase()===name.toLowerCase());
 if(ex){ex.qty+=qty;ex.t=Date.now();return[ex,false]}const it={id:uid(),fid:db.cur,name,qty,note:'',ok:false,t:Date.now()};db.items.push(it);return[it,true]}
function quickAdd(){const el=$('#qa'),v=el.value.trim();if(!v)return;const{name,qty}=parse(v);mark();const[it,isNew]=addStock(name,qty);save();el.value='';vib();render(it.id);
 toast(isNew?`Added ${name}: ${fmt(qty)}`:`${it.name} +${fmt(qty)} → ${fmt(it.qty)}`,restore)}

/* ---------- render ---------- */
function rInv(bumpId){
 const A=L0();
 const n=A.length,units=A.reduce((a,i)=>a+i.qty,0),done=A.filter(i=>i.ok).length;
 $('#st').innerHTML=`<div class="stats"><div><b>${n}</b><span class="mut">Items</span></div><div><b>${fmt(units)}</b><span class="mut">Total units</span></div></div>${n?`<div class="bar"><i style="width:${done/n*100}%"></i></div><div class="mut" style="margin-top:6px">${done} of ${n} checked</div>`:''}`;
 const F=[['all','All '+n],['todo','To check '+(n-done)],['done','Checked '+done],['zero','Out of stock '+A.filter(i=>!i.qty).length]];
 $('#ch').innerHTML=F.map(([k,l])=>`<button class="chip ${flt===k?'on':''}" data-f="${k}">${l}</button>`).join('')+`<button class="chip" data-act="sort">Sort: ${srt==='recent'?'Recent':'A–Z'}</button>`;
 let L=A.filter(i=>(!q||(i.name+i.note).toLowerCase().includes(q.toLowerCase()))&&(flt==='all'||(flt==='todo'&&!i.ok)||(flt==='done'&&i.ok)||(flt==='zero'&&!i.qty)));
 L.sort(srt==='az'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.t-a.t);
 $('#list').innerHTML=L.map(i=>`<div class="it ${i.ok?'ok':''}" data-id="${i.id}"><button class="ck" data-ck="${i.id}" aria-label="Mark checked">✓</button>
 <div class="ib" data-edit="${i.id}"><div class="in">${esc(i.name)}</div>${i.note?`<div class="mut t">${esc(i.note)}</div>`:''}</div>
 <button class="mn" data-d="${i.id}" aria-label="Minus one">−</button><button class="nm ${i.qty?'':'z'} ${i.id===bumpId?'bump':''}" data-k="${i.id}" aria-label="Set quantity">${fmt(i.qty)}</button><button class="pl" data-i="${i.id}" aria-label="Plus one">+</button></div>`).join('')
 ||`<div class="empty"><b>${n?'Nothing here':'Add your first item'}</b>${n?'Try another filter or search.':'Type a name and quantity in the bar below, like <i>Chairs 12</i>, then tap Add.'}</div>`}
function rHome(){const F=db.folders,u=db.items.reduce((a,i)=>a+i.qty,0);
 $('#home').innerHTML=(F.length?`<div class="card"><div class="stats"><div><b>${F.length}</b><span class="mut">Folders</span></div><div><b>${fmt(u)}</b><span class="mut">Units in total</span></div></div></div>`:'')+
 `<div class="fg">${F.map(f=>{const A=db.items.filter(i=>i.fid===f.id),d=A.filter(i=>i.ok).length;return `<button class="fc" data-fo="${f.id}" style="--c:${COL[f.col%COL.length]}"><div class="fd"></div><div class="fn">${esc(f.name)}</div><div class="mut">${A.length} item${A.length==1?'':'s'} · ${fmt(A.reduce((a,i)=>a+i.qty,0))} units</div><div class="bar" style="margin-top:10px"><i style="width:${A.length?d/A.length*100:0}%"></i></div></button>`}).join('')}<button class="fc nw" data-act="newf">＋ New folder</button></div>`+
 (F.length?'':`<div class="empty"><b>Make your first folder</b>Use folders to keep different stock apart, like Store room, Kitchen or Office.</div>`)}
function render(b){const f=cur();$('#home').hidden=!!f;$('#inv').hidden=!f;$('#addbar').hidden=!f;$('#back').hidden=!f;$('#lg').style.display=f?'none':'';$('#ttl').textContent=f?f.name:'Count It';f?rInv(b):rHome()}
function folderSheet(f){sheet(`<h3>${f?'Rename folder':'New folder'}</h3><p class="mut">A separate inventory, like Store room or Kitchen.</p><input id="fnm" value="${esc(f?f.name:'')}" maxlength="40" placeholder="Folder name">
 ${f?'':`<div class="chips">${['Store room','Kitchen','Office','Workshop'].filter(n=>!db.folders.some(x=>x.name===n)).map(n=>`<button class="chip" data-sug="${n}">${n}</button>`).join('')}</div>`}
 <button class="btn ac w" data-act="fsave" data-id="${f?f.id:''}" style="margin-top:14px">${f?'Save':'Create folder'}</button>`);$('#fnm').onkeydown=e=>{if(e.key==='Enter')fSave(f?f.id:'')}}
function fSave(id){const n=$('#fnm').value.trim();if(!n)return;if(db.folders.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase()))return toast('That folder already exists');
 if(id)db.folders.find(x=>x.id===id).name=n;else{const f={id:uid(),name:n,col:db.folders.length};db.folders.push(f);db.cur=f.id;q='';$('#q').value='';flt='all'}save();closeSheet();render();scrollTo(0,0)}
function change(id,d){const i=item(id);if(!i)return;i.qty=Math.max(0,i.qty+d);i.t=Date.now();save();vib();render(id)}

/* ---------- sheets ---------- */
function keypad(id){const i=item(id);sheet(`<h3>${esc(i.name)}</h3><p class="mut">Set the quantity</p><input id="kv" class="kv" type="number" inputmode="decimal" value="${i.qty}" data-id="${id}">
 <div class="row" style="justify-content:center;margin-top:12px;flex-wrap:wrap">${[1,5,10,50].map(n=>`<button class="chip" data-add="${n}">+${n}</button>`).join('')}</div>
 <div class="row" style="margin-top:16px"><button class="btn" data-act="x">Cancel</button><button class="btn p grow" data-act="kset">Set quantity</button></div>`);
 $('#kv').onkeydown=e=>{if(e.key==='Enter')kset()}}
function kset(){const i=item($('#kv').dataset.id);i.qty=Math.max(0,num($('#kv').value));i.t=Date.now();save();closeSheet();render(i.id)}
function editSheet(id){const i=item(id);sheet(`<h3>Edit item</h3><label>Name</label><input id="en" value="${esc(i.name)}"><label>Quantity</label><input id="eq" type="number" inputmode="decimal" value="${i.qty}"><label>Note (optional)</label><input id="eo" value="${esc(i.note)}" placeholder="e.g. Room 2, damaged"><label>Folder</label><select id="ef">${db.folders.map(f=>`<option value="${f.id}" ${f.id===i.fid?'selected':''}>${esc(f.name)}</option>`).join('')}</select>
 <div class="row" style="margin-top:18px"><button class="btn bad" data-act="del" data-id="${id}">Delete</button><span class="grow"></span><button class="btn p" data-act="esave" data-id="${id}">Save</button></div>`)}
function bulkSheet(){sheet(`<h3>Add many items</h3><p class="mut">One per line, like “Chairs 12”. Existing items get the quantity added.</p><textarea id="bt" rows="7" placeholder="Chairs 12&#10;Tables 4&#10;Whiteboard 2"></textarea><button class="btn ac w" data-act="badd" style="margin-top:14px">Add to stock</button>`)}
function menu(){const f=cur();sheet(`<h3>Menu</h3>${f?`<p class="mut">${esc(f.name)}</p><div class="grid2"><button class="btn" data-act="frn">Rename folder</button><button class="btn" data-act="reset">Reset checks</button><button class="btn" data-act="exp">Export CSV</button><button class="btn" data-act="imp">Import CSV</button><button class="btn" data-act="sample">Sample items</button><button class="btn bad" data-act="fdel">Delete folder</button></div>`:''}
 <label>Appearance</label><div class="seg">${['auto','light','dark'].map(t=>`<button data-th="${t}" class="${db.theme===t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
 <div class="grid2"><button class="btn" data-act="bk">Backup all</button><button class="btn" data-act="rs">Restore</button></div><button class="btn bad w" data-act="wipe" style="margin-top:14px">Erase everything</button>`)}

/* ---------- files ---------- */
function download(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty||'text/csv'}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const cc=v=>/[",\n]/.test(v=String(v??''))?'"'+String(v).replace(/"/g,'""')+'"':v;
function parseCSV(t){const o=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===','){r.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x!==''))o.push(r);r=[]}else c+=h}r.push(c);if(r.some(x=>x!==''))o.push(r);return o}
function pickFile(cb){const f=$('#file');f.value='';f.onchange=()=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsText(f.files[0])};f.click()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 if(e.target.id==='sw')return closeSheet();
 const t=e.target.closest('[data-fo],[data-sug],[data-i],[data-d],[data-k],[data-ck],[data-edit],[data-f],[data-act],[data-add],[data-th]');if(!t)return;const D=t.dataset;
 if(D.fo){db.cur=D.fo;q='';$('#q').value='';flt='all';save();render();return scrollTo(0,0)}
 if(D.sug){$('#fnm').value=D.sug;return}
 if(D.i)return change(D.i,1);if(D.d)return change(D.d,-1);if(D.k)return keypad(D.k);
 if(D.ck){const i=item(D.ck);i.ok=!i.ok;save();vib();return render()}
 if(D.edit)return editSheet(D.edit);if(D.f){flt=D.f;return render()}
 if(D.add){const k=$('#kv');k.value=num(k.value)+num(D.add);return vib()}
 if(D.th){db.theme=D.th;applyTheme();save();return menu()}
 switch(D.act){
  case'home':db.cur=null;save();render();return scrollTo(0,0);case'newf':return folderSheet();case'frn':return folderSheet(cur());case'fsave':return fSave(D.id);
  case'fdel':{const f=cur(),n=L0().length;if(!confirm(`Delete "${f.name}"${n?` and its ${n} item${n>1?'s':''}`:''}?`))return;mark();db.items=db.items.filter(x=>x.fid!==f.id);db.folders=db.folders.filter(x=>x!==f);db.cur=null;save();closeSheet();render();return toast(`Deleted ${f.name}`,restore)}
  case'qadd':return quickAdd();case'menu':return menu();case'bulk':return bulkSheet();case'x':return closeSheet();case'kset':return kset();
  case'sort':srt=srt==='recent'?'az':'recent';return render();
  case'esave':{const i=item(D.id),n=$('#en').value.trim();if(!n)return toast('Enter a name');const fid=$('#ef').value;if(db.items.some(x=>x!==i&&x.fid===fid&&x.name.toLowerCase()===n.toLowerCase()))return toast('That item already exists in that folder');
   i.fid=fid;i.name=n;i.qty=Math.max(0,num($('#eq').value));i.note=$('#eo').value.trim();i.t=Date.now();save();closeSheet();return render(i.id)}
  case'del':{mark();const n=item(D.id).name;db.items=db.items.filter(x=>x.id!==D.id);save();closeSheet();render();return toast(`Deleted ${n}`,restore)}
  case'badd':{const L=$('#bt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return;mark();L.forEach(l=>{const p=parse(l);addStock(p.name,p.qty)});save();closeSheet();render();return toast(`${L.length} line${L.length>1?'s':''} added`,restore)}
  case'reset':mark();L0().forEach(i=>i.ok=false);save();closeSheet();render();return toast('Checks reset',restore);
  case'exp':return download((cur().name.replace(/\W+/g,'_')||'count-it')+'.csv',['name,qty,note',...L0().map(i=>[cc(i.name),i.qty,cc(i.note)].join(','))].join('\n'));
  case'imp':return pickFile(t=>{const r=parseCSV(t),h=r.shift().map(x=>x.trim().toLowerCase());let n=0;mark();r.forEach(x=>{const o={};h.forEach((k,i)=>o[k]=(x[i]||'').trim());if(!o.name)return;const ex=L0().find(i=>i.name.toLowerCase()===o.name.toLowerCase()),qy=num(o.qty??o.quantity);
   if(ex){ex.qty=qy;if(o.note)ex.note=o.note}else db.items.push({id:uid(),fid:db.cur,name:o.name,qty:qy,note:o.note||'',ok:false,t:Date.now()});n++});save();closeSheet();render();toast(n+' items imported',restore)});
  case'sample':mark();[['Chairs',40],['Tables',12],['Whiteboards',6],['Projectors',3],['Laptops',25]].forEach(([n,q])=>addStock(n,q));save();closeSheet();render();return toast('Sample items added',restore);
  case'bk':return download('count-it-backup.json',JSON.stringify(db),'application/json');
  case'rs':return pickFile(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.items))throw 0;mark();db={items:o.items,folders:o.folders||[],cur:null,theme:o.theme||'auto'};migrate();save();applyTheme();closeSheet();render();toast('Backup restored',restore)}catch(e){toast('That file is not a Count It backup')}});
  case'wipe':if(confirm('Erase every item on this device?')){mark();db.items=[];db.folders=[];db.cur=null;save();closeSheet();render();toast('Everything erased',restore)}return}});
$('#q').oninput=e=>{q=e.target.value;render()};
$('#qa').onkeydown=e=>{if(e.key==='Enter')quickAdd()};
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#install').hidden=false});
$('#install').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('#install').hidden=true};
window.addEventListener('appinstalled',()=>$('#install').hidden=true);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
applyTheme();render();
</script></body></html>
